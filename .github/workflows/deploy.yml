name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the Europe pressure map every 6 hours (after the ECMWF runs).
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Load Europe pressure map data
        timeout-minutes: 6
        continue-on-error: true
        run: python3 scripts/build-pressure.py || echo "::warning::Luftdruckdaten nicht verfügbar – Karte wird ausgeblendet"
      - name: Load 14-day trend data
        timeout-minutes: 5
        continue-on-error: true
        run: python3 scripts/build-trend.py || echo "::warning::Trenddaten nicht verfügbar – Trend wird ausgeblendet"
      - name: Probe models (log only)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/probe-models.py
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
